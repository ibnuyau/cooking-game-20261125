<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle &amp; Serve — Dapur Kilat</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="wrap">
  <h1>Sizzle &amp; Serve <span class="tag">Dapur Kilat</span></h1>
  <p class="sub">A one-chef kitchen rush. Cook at the stations, build the dish on the plate, serve before the customer walks out.</p>
  <canvas id="game" width="1280" height="720"></canvas>
  <div class="bar">
    <span id="status">Click START SHIFT, or press Enter. Keys 1–4 cook, Space serves, C clears the plate, P pauses.</span>
    <button id="mute" type="button">Sound: on</button>
  </div>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
